[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = false

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true
unsafe-fixes = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # warnings
    "I",  # import sorting
]
ignore = [
    "D",      # ignore docstring enforcement
    "ANN",    # type annotation linting disabled
    "N",      # naming conventions
    "PLR0913", # too many arguments
    "E501",   # line too long — black handles line length for real code
]

[tool.ruff.lint.isort]
known-first-party = ["myproject"]
